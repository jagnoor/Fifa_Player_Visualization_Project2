<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.9.0/slick-theme.min.css"
        integrity="sha512-17EgCFERpgZKcm0j0fEq1YCJuyAWdz9KUtv1EjVuaOz8pDnh/0nZxmU6BBXwaaxqoi9PQXnRWqlcDB027hgv9A=="
        crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.9.0/slick.min.css"
        integrity="sha512-yHknP1/AwR+yx26cB1y0cjvQUMvEa2PFzt1c9LlS4pRQ5NOTZFWbhBig+X9G9eYW/8m0/4OXNx8pxJ6z57x0dw=="
        crossorigin="anonymous" />
    <link rel="stylesheet" href="/static/css/style.css">
    <title>FIFA Player Visualization</title>
</head>

<body style="background-color: rgb(44,114,142);">
    <nav class="nav justify-content-center nav-pills bg-dark">
        <ul class="nav">
            <li class="nav-item">
                <a class="nav-link active" href="/">Home</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="compare">Comparison</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="visualizations">Visualizations</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="about">About</a>
            </li>
        </ul>
    </nav>

    <!-- D3 Circle Packing Visualization -->
    <div class="container mt-4">
        <div class="text-center">
            <h3 style="color: #fff; margin-bottom: 10px;">Top 2000 FIFA Players by Nationality</h3>
            <p style="color: rgba(255,255,255,0.7); font-size: 14px;">Click on a continent to zoom in, then click a country to see players. Click background to zoom out.</p>
        </div>
        <div class="d3-details text-center">
            <svg width="800" height="800"></svg>
        </div>
    </div>

    <!-- Plotly Charts in Slider -->
    <div class="container mt-4">
        <div class="row slider">
            <div class="bar-plot">
                <div class="col-md-12">
                    <div id="country"></div>
                </div>
            </div>
            <div class="bar-plot">
                <div class="col-md-12">
                    <div id="high-earn"></div>
                </div>
            </div>
            <div class="bar-plot">
                <div class="col-md-12">
                    <div id="age"></div>
                </div>
            </div>
            <div class="bar-plot">
                <div class="col-md-12">
                    <div id="club"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/d3.v7.min.js"></script>
    <script src="/static/js/plotly.min.js"></script>
    <script src="/static/js/logic.js"></script>

    <script src="/static/js/bootstrap.bundle.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.9.0/slick.min.js"
        integrity="sha512-HGOnQO9+SP1V92SrtZfjqxxtLmVzqZpjFFekvzZVWoiASSQgSr4cw9Kqd2+l8Llp4Gm0G8GIFJ4ddwZilcdb8A=="
        crossorigin="anonymous"></script>

    <script type="text/javascript">
        $('.slider').slick({
            dots: true,
            infinite: true,
            speed: 300,
            slidesToShow: 2,
            slidesToScroll: 1,
            responsive: [
                {
                    breakpoint: 1024,
                    settings: {
                        slidesToShow: 2,
                        slidesToScroll: 1,
                        infinite: true,
                        dots: true
                    }
                },
                {
                    breakpoint: 600,
                    settings: {
                        slidesToShow: 1,
                        slidesToScroll: 1
                    }
                }
            ]
        });
    </script>

</body>

</html>
